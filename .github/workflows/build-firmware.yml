name: Build proxy firmware and publish install page

# Compiles the browser-install ESP32 firmware for every supported chip family
# and deploys a one-click install page to GitHub Pages. New users flash from the
# browser and enter WiFi there; nobody needs ESPHome, Python or a command line.
# esp-web-tools picks the build that matches the board that is plugged in.
#
# The tuned baked-in config in esphome/geberit-aquaclean-proxy.yaml is untouched
# and stays the advanced path.
#
# Pages must be enabled once by hand: repo Settings -> Pages -> Build and
# deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - esphome/webinstall/**
      - webinstall/**
      - .github/workflows/build-firmware.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ESP32 (classic, e.g. WROOM)
        id: esp32
        uses: esphome/build-action@v7.0.0
        with:
          yaml-file: esphome/webinstall/esp32.yaml
          version: latest
          complete-manifest: true

      - name: Build ESP32-C3
        id: c3
        uses: esphome/build-action@v7.0.0
        with:
          yaml-file: esphome/webinstall/esp32c3.yaml
          version: latest
          complete-manifest: true

      - name: Build ESP32-S3
        id: s3
        uses: esphome/build-action@v7.0.0
        with:
          yaml-file: esphome/webinstall/esp32s3.yaml
          version: latest
          complete-manifest: true

      # Collect every chip's firmware into one folder and merge the per-chip
      # manifests into a single manifest esp-web-tools can pick from.
      - name: Combine into one install site
        run: |
          mkdir -p site/firmware
          cp webinstall/index.html site/index.html
          for dir in "${{ steps.esp32.outputs.name }}" "${{ steps.c3.outputs.name }}" "${{ steps.s3.outputs.name }}"; do
            cp "$dir"/*.bin site/firmware/
          done
          node webinstall/merge-manifests.mjs \
            "${{ steps.esp32.outputs.name }}/manifest.json" \
            "${{ steps.c3.outputs.name }}/manifest.json" \
            "${{ steps.s3.outputs.name }}/manifest.json" \
            > site/firmware/manifest.json
          echo "Combined manifest:"
          cat site/firmware/manifest.json
          echo "Published firmware files:"
          ls -R site/firmware

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
