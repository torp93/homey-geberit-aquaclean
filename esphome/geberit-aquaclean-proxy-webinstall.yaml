# Geberit AquaClean Bluetooth proxy — browser-install variant.
#
# Identical BLE/proxy tuning to geberit-aquaclean-proxy.yaml, with two changes
# that make it installable from a web page with no ESPHome, no compile and no
# secrets file:
#
#   - WiFi is NOT baked in. The wifi: block has no credentials, and
#     improv_serial lets the browser installer ask for them over USB right
#     after flashing. improv_serial needs a serial logger, so the
#     "baud_rate: 0" from the main config is dropped here.
#   - A project: block names the firmware on the install page.
#
# This file is compiled by .github/workflows/build-firmware.yml and published
# to GitHub Pages; it is not meant to be flashed by hand. Advanced users who
# want a baked-in config should use geberit-aquaclean-proxy.yaml instead.
#
# captive_portal is deliberately absent: on the C3 it costs heap the BLE proxy
# needs (see the note at the foot of the main config). improv_serial covers
# re-provisioning by re-plugging USB, without that cost.

esphome:
  name: geberit-aquaclean-proxy
  friendly_name: Geberit AquaClean Proxy
  project:
    name: torp93.geberit_aquaclean_proxy
    version: "1.0"

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: n   # BLE 5.0 off — frees ~40 KB RAM
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y   # BLE 4.2 is all the AquaClean needs

logger:
  level: INFO
  # No baud_rate: 0 here — improv_serial talks over this serial to receive the
  # WiFi credentials from the browser.

api:
  reboot_timeout: 15min

ota:
  - platform: esphome

wifi:
  power_save_mode: NONE   # avoids WiFi/BLE contention on the shared 2.4 GHz radio
  # No ssid/password: the browser installer sets them over USB via improv_serial.

# Lets web.esphome.io (and the install page) send the WiFi credentials over the
# USB serial connection right after flashing. No captive portal, no secrets.
improv_serial:

esp32_ble_tracker:
  id: ble_tracker_id
  scan_parameters:
    active: true
    interval: 320ms
    window: 200ms

bluetooth_proxy:
  active: true
  connection_slots: 1

# The Homey app presses these to recover a wedged proxy: cache clear, then
# restart. Keep both.
button:
  - platform: restart
    name: "Restart AquaClean Proxy"

  - platform: factory_reset
    name: "Clear Bluetooth Cache"

debug:

sensor:
  - platform: wifi_signal
    name: "Proxy WiFi Signal"
    update_interval: 60s

  - platform: debug
    free:
      name: "Proxy Free Heap"
    block:
      name: "Proxy Max Free Block"

  - platform: uptime
    name: "Proxy Uptime"
