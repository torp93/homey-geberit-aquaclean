# Shared browser-install config for the Geberit AquaClean proxy.
#
# Everything except the chip-specific esp32: block lives here and is pulled into
# each per-chip file via `packages:`. Those files (esp32c3.yaml, esp32.yaml,
# esp32s3.yaml) are compiled by .github/workflows/build-firmware.yml into one
# install page whose manifest lists every chip, so esp-web-tools picks the build
# that matches whatever board is plugged in.
#
# WiFi is not baked in: improv_serial lets the browser installer send the
# credentials over USB after flashing. No captive_portal (heap cost on the C3),
# and the logger keeps a serial so improv_serial can talk over it.

esphome:
  name: geberit-aquaclean-proxy
  friendly_name: Geberit AquaClean Proxy
  project:
    name: torp93.geberit_aquaclean_proxy
    version: "1.0"

logger:
  level: INFO

api:
  reboot_timeout: 15min

ota:
  - platform: esphome

wifi:
  power_save_mode: NONE   # avoids WiFi/BLE contention on the shared 2.4 GHz radio

improv_serial:

# A small diagnostic web page at the board's IP: WiFi signal, free heap,
# uptime, the restart / clear-cache buttons and a live log. Version 3 keeps
# its assets off-device, so the heap cost is modest. Measured safe even on a
# C3 with this lean config (the Geberit proxy at .13 is a C3 and sits around
# 88 KB free block with the web server on).
web_server:
  port: 80
  version: 3

esp32_ble_tracker:
  id: ble_tracker_id
  scan_parameters:
    active: true
    interval: 320ms
    window: 200ms

bluetooth_proxy:
  active: true
  connection_slots: 1

# The Homey app presses these to recover a wedged proxy: cache clear, then
# restart. Keep both.
button:
  - platform: restart
    name: "Restart AquaClean Proxy"

  - platform: factory_reset
    name: "Clear Bluetooth Cache"

# Maintenance mode — a real switch, not a stub. ON stops the BLE scanner to free
# the shared radio for OTA/firmware flashing or debugging; OFF resumes scanning.
# restore_mode ALWAYS_OFF means a reboot always returns to normal operation even
# if it was left on. While ON the toilet is unreachable by design.
switch:
  - platform: template
    name: "Proxy Maintenance Mode"
    id: maintenance_mode
    icon: "mdi:wrench"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - esp32_ble_tracker.stop_scan:
    turn_off_action:
      - esp32_ble_tracker.start_scan:
          continuous: true

debug:

sensor:
  - platform: wifi_signal
    name: "Proxy WiFi Signal"
    update_interval: 60s

  - platform: debug
    free:
      name: "Proxy Free Heap"
    block:
      name: "Proxy Max Free Block"

  - platform: uptime
    name: "Proxy Uptime"

  # True supply voltage is NOT available in software on the ESP32-C3: its ADC
  # reads a GPIO pin, not VCC (the `pin: VCC` trick is ESP8266-only). To measure
  # the real rail, fit a resistor divider from 3V3 (or 5V) to a free ADC1 GPIO
  # (GPIO0-4 on the C3) and uncomment this. Pick R1/R2 so the divided voltage
  # stays under ~2.5 V, and set `multiply` to (R1+R2)/R2. Example for 5V with
  # R1=100k, R2=47k -> ratio 3.13:
  # - platform: adc
  #   pin: GPIO3            # ADC1_CH3
  #   name: "Proxy Supply Voltage"
  #   attenuation: 12db
  #   update_interval: 60s
  #   accuracy_decimals: 2
  #   filters:
  #     - multiply: 3.128   # (100k + 47k) / 47k

# The board's IP as a first-class entity: it shows on the web status page and is
# logged on connect, so you never have to hunt for it. (Homey still reaches the
# proxy by the IP or geberit-aquaclean-proxy.local; this just makes it visible.)
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Proxy IP Address"
    ssid:
      name: "Proxy WiFi Network"

  # The real "power health" signal on a C3: why the board last reset. A
  # brownout here (rather than a clean power-on or software restart) is the
  # fingerprint of an unstable supply, which is what a voltage reading would be
  # watched for anyway. Read it together with uptime.
  - platform: debug
    reset_reason:
      name: "Proxy Reset Reason"
