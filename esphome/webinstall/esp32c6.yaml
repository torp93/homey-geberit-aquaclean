# ESP32-C6. esp-idf + BLE 5.0 disabled like the C3/S3.
# Reported as the most reliable proxy chip for this toilet: in
# jens62/geberit-aquaclean#48 two classic ESP32 boards showed intermittent BLE
# disconnects (reason 0x08) that disappeared after switching to a C6.
packages:
  base: !include base.yaml

esp32:
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: n
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
